name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dipendenze npm
      run: npm install

    - name: Capacitor add android
      run: npx cap add android

    - name: Capacitor sync
      run: npx cap sync android

    - name: Copia TelnetClusterPlugin
      run: |
        DEST="android/app/src/main/java/it/iw1fzr/dxcluster/plugins"
        mkdir -p "$DEST"
        cp android-plugin/TelnetClusterPlugin.java "$DEST/"

    - name: Patch MainActivity
      run: |
        MAIN="android/app/src/main/java/it/iw1fzr/dxcluster/MainActivity.java"
        sed -i 's/import com\.getcapacitor\.BridgeActivity;/import com.getcapacitor.BridgeActivity;\nimport it.iw1fzr.dxcluster.plugins.TelnetClusterPlugin;/' "$MAIN"
        sed -i 's/super\.onCreate(savedInstanceState);/registerPlugin(TelnetClusterPlugin.class);\n        super.onCreate(savedInstanceState);/' "$MAIN"

    - name: Patch AndroidManifest
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <application/' "$MANIFEST"

    - name: Decodifica keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

    - name: Verifica keystore
      run: |
        keytool -list \
          -keystore android/release.keystore \
          -storepass "${{ secrets.KEYSTORE_PASS }}" \
          -alias "${{ secrets.KEY_ALIAS }}"

    - name: Build APK release
      working-directory: android
      env:
        KSPASS: ${{ secrets.KEYSTORE_PASS }}
        KALIAS: ${{ secrets.KEY_ALIAS }}
        KPASS:  ${{ secrets.KEY_PASS }}
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file="$(pwd)/release.keystore" \
          -Pandroid.injected.signing.store.password="$KSPASS" \
          -Pandroid.injected.signing.key.alias="$KALIAS" \
          -Pandroid.injected.signing.key.password="$KPASS"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DXCluster-APK
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    - name: Crea Release GitHub
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: android/app/build/outputs/apk/release/app-release.apk
        name: "DX Cluster ${{ github.ref_name }}"
        body: |
          ## DX Cluster · IW1FZR ${{ github.ref_name }}
          Connessione TCP nativa ai cluster DX
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
