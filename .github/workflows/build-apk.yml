name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dipendenze npm
      run: npm install

    - name: Capacitor add android
      run: npx cap add android

    - name: Capacitor sync
      run: npx cap sync android

    - name: Copia TelnetClusterPlugin
      run: |
        DEST="android/app/src/main/java/it/iw1fzr/dxcluster/plugins"
        mkdir -p "$DEST"
        cp android-plugin/TelnetClusterPlugin.java "$DEST/"

    - name: Patch MainActivity
      run: |
        MAIN="android/app/src/main/java/it/iw1fzr/dxcluster/MainActivity.java"
        cat > "$MAIN" << 'JAVAEOF'
        package it.iw1fzr.dxcluster;
        import android.os.Bundle;
        import com.getcapacitor.BridgeActivity;
        import it.iw1fzr.dxcluster.plugins.TelnetClusterPlugin;
        public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
                registerPlugin(TelnetClusterPlugin.class);
                super.onCreate(savedInstanceState);
            }
        }
        JAVAEOF
        echo "=== DOPO ==="
        cat "$MAIN"

    - name: Patch AndroidManifest
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <application/' "$MANIFEST"

    - name: Build APK debug
      working-directory: android
      run: ./gradlew assembleDebug

    - name: Trova APK
      run: find android/app/build/outputs -name "*.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DXCluster-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
